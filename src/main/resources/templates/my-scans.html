<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Allyscan &mdash; My Scans</title>
    <link rel="stylesheet" href="/style.css">
    <script>(function(){try{var t=localStorage.getItem('theme');if(t==='light'||t==='dark'||t==='system'){document.documentElement.setAttribute('data-theme',t);}}catch(e){}})();</script>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%235b4bf0'/%3E%3Cpath d='M4 17h4l3-8h6l3 8' stroke='white' stroke-width='2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
</head>
<body>
<div class="app-shell">
    <div th:replace="~{fragments/shell :: sidebar(active='history')}"></div>
    <div class="sidebar-backdrop"></div>

    <div class="app-main">
        <div th:replace="~{fragments/shell :: topbar}"></div>

        <div class="app-main-inner" style="padding-top:2rem;">
            <div class="flash" role="status" th:if="${submittedId}">
                Scan queued (id: <code th:text="${submittedId}">id</code>). It will appear below once a worker picks it up.
            </div>

            <form class="new-scan" method="post" th:action="@{/account/scans}" aria-label="Start a new scan">
                <div>
                    <label for="url">Website URL to scan</label>
                    <input type="url" id="url" name="url" placeholder="https://example.com" required>
                </div>
                <button type="submit">Scan</button>
            </form>

            <section aria-labelledby="my-scans-heading">
                <h2 id="my-scans-heading">My scans</h2>
                <p class="tagline">Every scan you've submitted, private to your account.</p>
                <div th:replace="~{fragments/scan-history :: table(${jobs})}"></div>
            </section>
        </div>
    </div>
</div>
<script defer src="/shell.js"></script>
<script defer src="/app.js"></script>
</body>
</html>
