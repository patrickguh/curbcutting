<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<aside class="sidebar" th:fragment="sidebar(active)">
    <a href="/" class="sidebar-brand">
        <span class="logo-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 17h4l3-8h6l3 8" />
                <circle cx="6" cy="19" r="1.5" fill="currentColor" stroke="none" />
                <circle cx="18" cy="19" r="1.5" fill="currentColor" stroke="none" />
            </svg>
        </span>
        <span class="sidebar-brand-text">Curbcutting</span>
    </a>

    <nav class="sidebar-nav" aria-label="Main">
        <a href="/" class="sidebar-link" th:classappend="${active == 'home'} ? ' active'">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
            New scan
        </a>
        <a href="/account/scans" class="sidebar-link" th:classappend="${active == 'history'} ? ' active'" sec:authorize="isAuthenticated()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/><path d="M12 7v5l4 2"/></svg>
            Scan history
        </a>
        <a href="/how-it-works" class="sidebar-link" th:classappend="${active == 'how-it-works'} ? ' active'">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 0 1 5 0c0 1.5-2 2-2.5 3.5M12 17h.01"/></svg>
            How it works
        </a>
        <a href="/settings" class="sidebar-link" th:classappend="${active == 'settings'} ? ' active'">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            Settings
        </a>
    </nav>

    <div class="sidebar-spacer"></div>

    <div class="sidebar-bottom">
        <div class="sidebar-account" sec:authorize="isAuthenticated()">
            <span class="sidebar-account-email" sec:authentication="name"></span>
            <form method="post" th:action="@{/logout}" class="logout-form">
                <button type="submit" class="link-button">Log out</button>
            </form>
        </div>
        <div class="sidebar-auth-cta" sec:authorize="isAnonymous()">
            <a href="/login" class="sidebar-link">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/></svg>
                Log in
            </a>
            <a href="/register" class="sidebar-link sidebar-signup">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg>
                Sign up
            </a>
        </div>
    </div>
</aside>

<div class="app-topbar" th:fragment="topbar">
    <button type="button" class="sidebar-toggle" aria-label="Open menu" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
    <span class="sidebar-brand-text" style="font-size:1rem;">Curbcutting</span>
</div>

</body>
</html>
