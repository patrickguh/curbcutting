<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Curbcutting &mdash; Settings</title>
    <link rel="stylesheet" href="/style.css">
    <script>(function(){try{var t=localStorage.getItem('theme');if(t==='light'||t==='dark'||t==='system'){document.documentElement.setAttribute('data-theme',t);}}catch(e){}})();</script>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%235b4bf0'/%3E%3Cpath d='M4 17h4l3-8h6l3 8' stroke='white' stroke-width='2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
</head>
<body>
<div class="app-shell">
    <div th:replace="~{fragments/shell :: sidebar(active='settings')}"></div>
    <div class="sidebar-backdrop"></div>

    <div class="app-main">
        <div th:replace="~{fragments/shell :: topbar}"></div>

        <div class="app-main-inner" style="padding-top:2rem; max-width:36rem;">
            <h2 style="margin-bottom:1.25rem;">Settings</h2>

            <section class="auth-card" aria-labelledby="theme-heading" style="margin:0 0 1.5rem;">
                <h2 id="theme-heading" style="font-size:1.1rem;">Appearance</h2>
                <p class="auth-switch" style="margin:0 0 1rem; text-align:left;">Choose how Curbcutting looks on this device.</p>
                <div class="theme-switch" role="group" aria-label="Theme">
                    <button type="button" class="theme-option" data-theme-value="system" aria-pressed="false">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
                        System
                    </button>
                    <button type="button" class="theme-option" data-theme-value="light" aria-pressed="false">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
                        Light
                    </button>
                    <button type="button" class="theme-option" data-theme-value="dark" aria-pressed="false">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                        Dark
                    </button>
                </div>
            </section>

            <section class="auth-card" aria-labelledby="account-heading" style="margin:0 0 1.5rem;" sec:authorize="isAuthenticated()">
                <h2 id="account-heading" style="font-size:1.1rem;">Account</h2>
                <p class="auth-switch" style="margin:0 0 0.3rem; text-align:left;">Signed in as</p>
                <p style="font-weight:700; margin:0 0 1.2rem;" th:text="${userEmail}">you@example.com</p>
                <div class="law-links">
                    <a href="/forgot-password">Reset password</a>
                    <a href="/account/scans">View scan history</a>
                </div>
            </section>

            <section class="auth-card" aria-labelledby="logout-heading" sec:authorize="isAuthenticated()">
                <h2 id="logout-heading" style="font-size:1.1rem;">Log out</h2>
                <p class="auth-switch" style="margin:0 0 1.2rem; text-align:left;">Sign out of Curbcutting on this device.</p>
                <form method="post" th:action="@{/logout}">
                    <button type="submit">Log out</button>
                </form>
            </section>

            <section class="auth-card" aria-labelledby="guest-heading" sec:authorize="isAnonymous()">
                <h2 id="guest-heading" style="font-size:1.1rem;">No account yet</h2>
                <p class="auth-switch" style="margin:0 0 1.2rem; text-align:left;">Log in or sign up to keep a
                    permanent, private scan history.</p>
                <div class="law-links">
                    <a href="/login">Log in</a>
                    <a href="/register" class="cta-primary">Sign up free</a>
                </div>
            </section>
        </div>
    </div>
</div>
<script defer src="/shell.js"></script>
<script defer src="/theme.js"></script>
</body>
</html>
