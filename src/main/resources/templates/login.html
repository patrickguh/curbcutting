<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Allyscan &mdash; Log in</title>
    <link rel="stylesheet" href="/style.css">
    <script>(function(){try{var t=localStorage.getItem('theme');if(t==='light'||t==='dark'||t==='system'){document.documentElement.setAttribute('data-theme',t);}}catch(e){}})();</script>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%235b4bf0'/%3E%3Cpath d='M4 17h4l3-8h6l3 8' stroke='white' stroke-width='2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
</head>
<body>
<div class="page-narrow">
<header>
    <div class="logo-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 17h4l3-8h6l3 8" />
            <circle cx="6" cy="19" r="1.5" fill="currentColor" stroke="none" />
            <circle cx="18" cy="19" r="1.5" fill="currentColor" stroke="none" />
        </svg>
    </div>
    <div>
        <h1>Allyscan</h1>
        <nav><a href="/">&larr; Back to home</a></nav>
    </div>
</header>

<main>
    <section class="auth-card" aria-labelledby="login-heading">
        <h2 id="login-heading">Log in</h2>

        <div class="flash" role="status" th:if="${registered}">Account created &mdash; log in below.</div>
        <div class="flash" role="status" th:if="${passwordReset}">Password updated &mdash; log in below.</div>
        <p class="auth-error" th:if="${param.error}" role="alert">Incorrect email or password.</p>

        <form method="post" th:action="@{/login}" class="auth-form">
            <div>
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required autofocus autocomplete="email">
            </div>
            <div>
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required autocomplete="current-password">
            </div>
            <div class="remember-me-row">
                <input type="checkbox" id="remember-me" name="remember-me">
                <label for="remember-me">Keep me signed in on this device</label>
            </div>
            <button type="submit">Log in</button>
        </form>

        <p class="auth-switch"><a href="/forgot-password">Forgot your password?</a></p>
        <p class="auth-switch">No account yet? <a href="/register">Sign up</a></p>
    </section>
</main>
</div>
</body>
</html>
